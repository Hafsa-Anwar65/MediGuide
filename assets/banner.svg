<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="150" rx="24" fill="url(#glow)"/>

  <!-- soft circles -->
  <circle cx="1080" cy="40" r="120" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="1150" cy="270" r="90" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="60" cy="280" r="70" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- dotted delivery path -->
  <path d="M760 210 C 820 140, 900 250, 960 170" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- robot -->
  <g transform="translate(960 92)">
    <rect x="-8" y="62" width="136" height="70" rx="16" fill="#FFFFFF"/>
    <rect x="12" y="38" width="96" height="30" rx="8" fill="#FDE68A"/>
    <rect x="20" y="30" width="80" height="10" rx="5" fill="#F59E0B"/>
    <rect x="44" y="44" width="32" height="18" rx="3" fill="#FFFFFF"/>
    <rect x="56" y="47" width="8" height="12" fill="#EF4444"/>
    <rect x="54" y="49" width="12" height="8" fill="#EF4444"/>
    <circle cx="34" cy="96" r="9" fill="#0E7490"/>
    <circle cx="86" cy="96" r="9" fill="#0E7490"/>
    <circle cx="36" cy="94" r="3" fill="#FFFFFF"/>
    <circle cx="88" cy="94" r="3" fill="#FFFFFF"/>
    <circle cx="18" cy="140" r="16" fill="#1E293B"/>
    <circle cx="102" cy="140" r="16" fill="#1E293B"/>
    <circle cx="18" cy="140" r="6" fill="#94A3B8"/>
    <circle cx="102" cy="140" r="6" fill="#94A3B8"/>
  </g>

  <!-- pharmacy cross -->
  <g transform="translate(720 196)">
    <circle r="30" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="-7" y="-19" width="14" height="38" rx="3" fill="#10B981"/>
    <rect x="-19" y="-7" width="38" height="14" rx="3" fill="#10B981"/>
  </g>

  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF">MediGuide</text>
  <text x="74" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#E0F2FE">Medicine from the pharmacy to the ward,</text>
  <text x="74" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#E0F2FE">so nurses can stay with their patients.</text>
</svg>
